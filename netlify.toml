[build]
  command = "bun install && bun run db:generate && bun run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  BUN_VERSION = "latest"

# API routes need server-side rendering
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200
